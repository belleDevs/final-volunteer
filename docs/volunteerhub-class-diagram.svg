<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900">
  <rect width="1100" height="900" fill="#ffffff"/>

  <!-- User -->
  <g>
    <rect x="420" y="20" width="260" height="150" rx="6" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2"/>
    <rect x="420" y="20" width="260" height="28" rx="6" fill="#1e3a5f"/>
    <rect x="420" y="36" width="260" height="12" fill="#1e3a5f"/>
    <text x="550" y="40" text-anchor="middle" fill="#fff" font-family="Arial" font-size="14" font-weight="700">User</text>
    <line x1="420" y1="48" x2="680" y2="48" stroke="#1e3a5f" stroke-width="1.2"/>
    <text x="432" y="68" font-family="Arial" font-size="11" fill="#111">+ id: int</text>
    <text x="432" y="84" font-family="Arial" font-size="11" fill="#111">+ name: string</text>
    <text x="432" y="100" font-family="Arial" font-size="11" fill="#111">+ email: string</text>
    <text x="432" y="116" font-family="Arial" font-size="11" fill="#111">+ role: enum</text>
    <text x="432" y="132" font-family="Arial" font-size="11" fill="#111">+ status: string</text>
    <text x="432" y="148" font-family="Arial" font-size="11" fill="#111">+ organization_id: int</text>
    <text x="432" y="162" font-family="Arial" font-size="10" fill="#334155">(admin | organization | volunteer)</text>
  </g>

  <!-- Skill -->
  <g>
    <rect x="40" y="40" width="200" height="110" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
    <rect x="40" y="40" width="200" height="26" fill="#334155"/>
    <text x="140" y="58" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">Skill</text>
    <line x1="40" y1="66" x2="240" y2="66" stroke="#334155"/>
    <text x="52" y="86" font-family="Arial" font-size="11">+ id: int</text>
    <text x="52" y="102" font-family="Arial" font-size="11">+ name: string</text>
    <text x="52" y="118" font-family="Arial" font-size="11">+ description: string</text>
  </g>

  <!-- Event -->
  <g>
    <rect x="80" y="250" width="230" height="140" rx="6" fill="#ecfdf5" stroke="#065f46" stroke-width="1.8"/>
    <rect x="80" y="250" width="230" height="26" fill="#065f46"/>
    <text x="195" y="268" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">Event</text>
    <line x1="80" y1="276" x2="310" y2="276" stroke="#065f46"/>
    <text x="92" y="296" font-family="Arial" font-size="11">+ id: int</text>
    <text x="92" y="312" font-family="Arial" font-size="11">+ organization_id: int</text>
    <text x="92" y="328" font-family="Arial" font-size="11">+ title: string</text>
    <text x="92" y="344" font-family="Arial" font-size="11">+ location: string</text>
    <text x="92" y="360" font-family="Arial" font-size="11">+ status: string</text>
    <text x="92" y="376" font-family="Arial" font-size="11">+ start_time / end_time</text>
  </g>

  <!-- Task -->
  <g>
    <rect x="400" y="250" width="220" height="130" rx="6" fill="#fff7ed" stroke="#9a3412" stroke-width="1.8"/>
    <rect x="400" y="250" width="220" height="26" fill="#9a3412"/>
    <text x="510" y="268" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">Task</text>
    <line x1="400" y1="276" x2="620" y2="276" stroke="#9a3412"/>
    <text x="412" y="296" font-family="Arial" font-size="11">+ id: int</text>
    <text x="412" y="312" font-family="Arial" font-size="11">+ event_id: int</text>
    <text x="412" y="328" font-family="Arial" font-size="11">+ title: string</text>
    <text x="412" y="344" font-family="Arial" font-size="11">+ priority / status</text>
    <text x="412" y="360" font-family="Arial" font-size="11">+ due_date: datetime</text>
  </g>

  <!-- Assignment -->
  <g>
    <rect x="720" y="240" width="250" height="160" rx="6" fill="#fef2f2" stroke="#991b1b" stroke-width="1.8"/>
    <rect x="720" y="240" width="250" height="26" fill="#991b1b"/>
    <text x="845" y="258" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">Assignment</text>
    <line x1="720" y1="266" x2="970" y2="266" stroke="#991b1b"/>
    <text x="732" y="286" font-family="Arial" font-size="11">+ id: int</text>
    <text x="732" y="302" font-family="Arial" font-size="11">+ user_id: int</text>
    <text x="732" y="318" font-family="Arial" font-size="11">+ event_id / task_id</text>
    <text x="732" y="334" font-family="Arial" font-size="11">+ status: string</text>
    <text x="732" y="350" font-family="Arial" font-size="11">+ completion_note</text>
    <text x="732" y="366" font-family="Arial" font-size="11">+ completion_proof_path</text>
    <text x="732" y="382" font-family="Arial" font-size="11">+ hours_logged</text>
  </g>

  <!-- OrganizationApplication -->
  <g>
    <rect x="40" y="470" width="250" height="130" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
    <rect x="40" y="470" width="250" height="26" fill="#334155"/>
    <text x="165" y="488" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12" font-weight="700">OrganizationApplication</text>
    <line x1="40" y1="496" x2="290" y2="496" stroke="#334155"/>
    <text x="52" y="516" font-family="Arial" font-size="11">+ user_id: int</text>
    <text x="52" y="532" font-family="Arial" font-size="11">+ organization_id: int</text>
    <text x="52" y="548" font-family="Arial" font-size="11">+ status: string</text>
    <text x="52" y="564" font-family="Arial" font-size="11">+ interview details</text>
    <text x="52" y="580" font-family="Arial" font-size="11">+ reviewed_by / reviewed_at</text>
  </g>

  <!-- Certificate -->
  <g>
    <rect x="360" y="470" width="230" height="120" rx="6" fill="#f5f3ff" stroke="#5b21b6" stroke-width="1.8"/>
    <rect x="360" y="470" width="230" height="26" fill="#5b21b6"/>
    <text x="475" y="488" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">Certificate</text>
    <line x1="360" y1="496" x2="590" y2="496" stroke="#5b21b6"/>
    <text x="372" y="516" font-family="Arial" font-size="11">+ user_id: int</text>
    <text x="372" y="532" font-family="Arial" font-size="11">+ event_id: int</text>
    <text x="372" y="548" font-family="Arial" font-size="11">+ certificate_code</text>
    <text x="372" y="564" font-family="Arial" font-size="11">+ hours_rendered / issued_at</text>
  </g>

  <!-- EventPhoto -->
  <g>
    <rect x="660" y="470" width="200" height="100" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
    <rect x="660" y="470" width="200" height="26" fill="#334155"/>
    <text x="760" y="488" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">EventPhoto</text>
    <line x1="660" y1="496" x2="860" y2="496" stroke="#334155"/>
    <text x="672" y="516" font-family="Arial" font-size="11">+ id: int</text>
    <text x="672" y="532" font-family="Arial" font-size="11">+ event_id: int</text>
    <text x="672" y="548" font-family="Arial" font-size="11">+ file_path: string</text>
  </g>

  <!-- RecordArchive -->
  <g>
    <rect x="40" y="660" width="230" height="110" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
    <rect x="40" y="660" width="230" height="26" fill="#334155"/>
    <text x="155" y="678" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">RecordArchive</text>
    <line x1="40" y1="686" x2="270" y2="686" stroke="#334155"/>
    <text x="52" y="706" font-family="Arial" font-size="11">+ table_name: string</text>
    <text x="52" y="722" font-family="Arial" font-size="11">+ original_data: json</text>
    <text x="52" y="738" font-family="Arial" font-size="11">+ archived_by: int</text>
    <text x="52" y="754" font-family="Arial" font-size="10">(documents / records)</text>
  </g>

  <!-- ChatbotRule -->
  <g>
    <rect x="340" y="660" width="210" height="100" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
    <rect x="340" y="660" width="210" height="26" fill="#334155"/>
    <text x="445" y="678" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">ChatbotRule</text>
    <line x1="340" y1="686" x2="550" y2="686" stroke="#334155"/>
    <text x="352" y="706" font-family="Arial" font-size="11">+ id: int</text>
    <text x="352" y="722" font-family="Arial" font-size="11">+ keyword: string</text>
    <text x="352" y="738" font-family="Arial" font-size="11">+ response: string</text>
  </g>

  <!-- OrgConversation -->
  <g>
    <rect x="620" y="650" width="240" height="120" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
    <rect x="620" y="650" width="240" height="26" fill="#334155"/>
    <text x="740" y="668" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="700">OrgConversation</text>
    <line x1="620" y1="676" x2="860" y2="676" stroke="#334155"/>
    <text x="632" y="696" font-family="Arial" font-size="11">+ organization_id: int</text>
    <text x="632" y="712" font-family="Arial" font-size="11">+ volunteer_id: int</text>
    <text x="632" y="728" font-family="Arial" font-size="11">+ mode: assistant|agent</text>
    <text x="632" y="744" font-family="Arial" font-size="11">+ needs_takeover: bool</text>
  </g>

  <!-- Relationships -->
  <!-- User - Skill M:N -->
  <line x1="240" y1="95" x2="420" y2="95" stroke="#111" stroke-width="1.4"/>
  <text x="320" y="88" text-anchor="middle" font-family="Arial" font-size="10">M:N user_skills</text>

  <!-- User org creates Event -->
  <path d="M420 160 L195 250" stroke="#111" stroke-width="1.4" fill="none"/>
  <text x="280" y="210" font-family="Arial" font-size="10">1 org creates *</text>

  <!-- Event has Task -->
  <line x1="310" y1="320" x2="400" y2="320" stroke="#111" stroke-width="1.4"/>
  <text x="355" y="312" text-anchor="middle" font-family="Arial" font-size="10">1..*</text>

  <!-- Task - Skill M:N -->
  <path d="M140 150 L140 230 L400 280" stroke="#111" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
  <text x="210" y="230" font-family="Arial" font-size="10">M:N task_skills</text>

  <!-- Task has Assignment -->
  <line x1="620" y1="320" x2="720" y2="320" stroke="#111" stroke-width="1.4"/>
  <text x="670" y="312" text-anchor="middle" font-family="Arial" font-size="10">1..*</text>

  <!-- User has Assignment -->
  <path d="M650 170 L845 240" stroke="#111" stroke-width="1.4" fill="none"/>
  <text x="760" y="195" font-family="Arial" font-size="10">1..*</text>

  <!-- Event has Assignment -->
  <path d="M310 360 L720 340" stroke="#111" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>

  <!-- User OrgApplication -->
  <path d="M420 160 L165 470" stroke="#111" stroke-width="1.3" fill="none"/>
  <text x="250" y="420" font-family="Arial" font-size="10">applies</text>

  <!-- User Certificate -->
  <path d="M500 170 L475 470" stroke="#111" stroke-width="1.3" fill="none"/>
  <text x="510" y="430" font-family="Arial" font-size="10">receives</text>

  <!-- Event Certificate -->
  <path d="M250 390 L400 500" stroke="#111" stroke-width="1.2" fill="none" stroke-dasharray="3 3"/>

  <!-- Event EventPhoto -->
  <path d="M280 390 L700 500" stroke="#111" stroke-width="1.2" fill="none"/>
  <text x="520" y="460" font-family="Arial" font-size="10">has photos</text>

  <!-- User RecordArchive -->
  <path d="M420 160 L120 660" stroke="#64748b" stroke-width="1.1" fill="none" stroke-dasharray="4 3"/>

  <!-- User OrgConversation -->
  <path d="M680 170 L740 650" stroke="#64748b" stroke-width="1.1" fill="none" stroke-dasharray="4 3"/>

  <text x="550" y="880" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">VolunteerHub — Class Diagram (core entities and relationships)</text>
</svg>
